name: ${COMPOSE_PROJECT_NAME:?set an environment-specific Compose project name}

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set a pinned PostgreSQL image digest}
    restart: unless-stopped
    shm_size: 256m
    env_file:
      - path: ${POSTGRES_ENV_FILE:?set the PostgreSQL-only environment file}
        format: raw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  django:
    <<: *service-defaults
    image: ${DJANGO_IMAGE:?set the release Django image digest}
    env_file:
      - path: ${POSTGRES_ENV_FILE:?set the PostgreSQL-only environment file}
        format: raw
      - path: ${DJANGO_ENV_FILE:?set the Django-only environment file}
        format: raw
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/readiness/', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      database:
      application:
      egress:
      edge:
        aliases:
          - ${DJANGO_EDGE_ALIAS:?set a unique edge alias}

  next:
    <<: *service-defaults
    image: ${NEXT_IMAGE:?set the release Next.js image digest}
    env_file:
      - path: ${NEXT_ENV_FILE:?set the Next-only environment file}
        format: raw
    depends_on:
      django:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - next_cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/internal/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      application:
      egress:
      edge:
        aliases:
          - ${NEXT_EDGE_ALIAS:?set a unique edge alias}

  worker:
    <<: *service-defaults
    image: ${DJANGO_IMAGE:?set the same release Django image digest}
    command:
      - python
      - manage.py
      - run_worker
      - --heartbeat-file
      - /tmp/kirillwynn-worker/heartbeat.json
    env_file:
      - path: ${POSTGRES_ENV_FILE:?set the PostgreSQL-only environment file}
        format: raw
      - path: ${WORKER_ENV_FILE:?set the worker-only environment file}
        format: raw
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,time,pathlib; p=pathlib.Path('/tmp/kirillwynn-worker/heartbeat.json'); d=json.loads(p.read_text()); raise SystemExit(0 if time.time()-d['timestamp'] < 120 else 1)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - database
      - application
      - egress

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:?set an environment-specific PostgreSQL volume}
    external: true
  next_cache:
    name: ${NEXT_CACHE_VOLUME:?set an environment-specific Next cache volume}

networks:
  database:
    name: ${DATABASE_NETWORK:?set an environment-specific database network}
    internal: true
  application:
    name: ${APPLICATION_NETWORK:?set an environment-specific application network}
    internal: true
  egress:
    name: ${EGRESS_NETWORK:?set an environment-specific egress network}
  edge:
    name: ${EDGE_NETWORK:?set a unique environment edge network}
    external: true
