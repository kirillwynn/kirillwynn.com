name: ${COMPOSE_PROJECT_NAME:?set an environment-specific Compose project name}

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set a pinned PostgreSQL image digest}
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set an environment-specific database}
      POSTGRES_USER: ${POSTGRES_USER:?set an environment-specific user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set the database secret}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  django:
    <<: *service-defaults
    image: ${DJANGO_IMAGE:?set the release Django image digest}
    env_file:
      - ${RUNTIME_ENV_FILE:?set the environment runtime file}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3); raise SystemExit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      internal:
      edge:
        aliases:
          - ${DJANGO_EDGE_ALIAS:?set a unique edge alias}

  next:
    <<: *service-defaults
    image: ${NEXT_IMAGE:?set the release Next.js image digest}
    env_file:
      - ${RUNTIME_ENV_FILE:?set the environment runtime file}
    environment:
      DJANGO_API_URL: http://django:8000
    depends_on:
      django:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - next_cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/internal/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      internal:
      edge:
        aliases:
          - ${NEXT_EDGE_ALIAS:?set a unique edge alias}

  worker:
    <<: *service-defaults
    image: ${DJANGO_IMAGE:?set the same release Django image digest}
    command:
      - python
      - manage.py
      - run_worker
      - --heartbeat-file
      - /tmp/kirillwynn-worker/heartbeat.json
    env_file:
      - ${RUNTIME_ENV_FILE:?set the environment runtime file}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,time,pathlib; p=pathlib.Path('/tmp/kirillwynn-worker/heartbeat.json'); d=json.loads(p.read_text()); raise SystemExit(0 if time.time()-d['timestamp'] < 120 else 1)"
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - internal

volumes:
  postgres_data:
  next_cache:

networks:
  internal:
    internal: true
  edge:
    name: ${EDGE_NETWORK:?set a unique environment edge network}
    attachable: true
