name: kirillwynn-integration

x-django-defaults: &django-defaults
  image: kirillwynn-django:ci
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m

services:
  postgres:
    image: postgres:17.6-alpine
    env_file:
      - path: ../tests/integration-env/postgres.env
        format: raw
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command:
      - server
      - /data
    environment:
      MINIO_ROOT_USER: integration
      MINIO_ROOT_PASSWORD: integration-only
    volumes:
      - minio_data:/data
    networks:
      - egress

  minio-public:
    image: nginx:1.29-alpine
    depends_on:
      - minio
    ports:
      - "127.0.0.1:19000:8080"
    volumes:
      - ../tests/minio-public.conf:/etc/nginx/nginx.conf:ro
    networks:
      - egress

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - mc alias set integration http://minio:9000 integration integration-only && mc mb --ignore-existing integration/kirillwynn-integration-media && mc anonymous set download integration/kirillwynn-integration-media
    networks:
      - egress

  mock-provider:
    image: python:3.12.13-alpine
    command:
      - python
      - /mock/http_mock.py
      - --port
      - "8080"
      - --name
      - egress-provider
    volumes:
      - ../tests/http_mock.py:/mock/http_mock.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - egress

  django:
    <<: *django-defaults
    env_file:
      - path: ../tests/integration-env/postgres.env
        format: raw
      - path: ../tests/integration-env/django.env
        format: raw
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readiness/', timeout=3)"
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      database:
      application:
      egress:
      staging_edge:
        aliases:
          - staging-django

  next:
    image: kirillwynn-next:ci
    env_file:
      - path: ../tests/integration-env/next.env
        format: raw
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/internal/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      application:
      egress:
      staging_edge:
        aliases:
          - staging-next

  worker:
    <<: *django-defaults
    command:
      - python
      - manage.py
      - run_worker
      - --heartbeat-file
      - /tmp/kirillwynn-worker/heartbeat.json
    env_file:
      - path: ../tests/integration-env/postgres.env
        format: raw
      - path: ../tests/integration-env/worker.env
        format: raw
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,time,pathlib; d=json.loads(pathlib.Path('/tmp/kirillwynn-worker/heartbeat.json').read_text()); raise SystemExit(0 if time.time()-d['timestamp'] < 120 else 1)"
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - database
      - application
      - egress

  edge:
    image: kirillwynn-edge:ci
    command:
      - nginx
      - -c
      - /etc/nginx/integration.conf
      - -g
      - daemon off;
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../nginx/integration.conf:/etc/nginx/integration.conf:ro
      - ../tests/integration.htpasswd:/etc/nginx/auth/integration.htpasswd:ro
    healthcheck:
      test:
        - CMD
        - nginx
        - -t
        - -c
        - /etc/nginx/integration.conf
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - staging_edge
      - production_edge

  production-django:
    profiles:
      - dynamic-edge
    image: python:3.12.13-alpine
    command:
      - python
      - /mock/http_mock.py
      - --port
      - "8080"
      - --name
      - production-django
    volumes:
      - ../tests/http_mock.py:/mock/http_mock.py:ro
    networks:
      production_edge:
        aliases:
          - production-django

  production-next:
    profiles:
      - dynamic-edge
    image: python:3.12.13-alpine
    command:
      - python
      - /mock/http_mock.py
      - --port
      - "8080"
      - --name
      - production-next
    volumes:
      - ../tests/http_mock.py:/mock/http_mock.py:ro
    networks:
      production_edge:
        aliases:
          - production-next

volumes:
  postgres_data:
    name: kirillwynn-integration-postgres
  minio_data:
    name: kirillwynn-integration-minio

networks:
  database:
    name: kirillwynn-integration-database
    internal: true
  application:
    name: kirillwynn-integration-application
    internal: true
  egress:
    name: kirillwynn-integration-egress
  staging_edge:
    name: kirillwynn-integration-staging-edge
  production_edge:
    name: kirillwynn-integration-production-edge
