name: kirillwynn-edge

services:
  edge:
    image: ${EDGE_IMAGE:?set the release edge image digest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=8m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
      - ${STAGING_HTPASSWD_FILE:-/etc/nginx/.htpasswd}:/etc/nginx/auth/staging.htpasswd:ro
    networks:
      - staging_edge
      - production_edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  staging_edge:
    name: ${STAGING_EDGE_NETWORK:-kirillwynn-staging-edge}
  production_edge:
    name: ${PRODUCTION_EDGE_NETWORK:-kirillwynn-production-edge}
