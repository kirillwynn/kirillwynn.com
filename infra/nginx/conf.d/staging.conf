upstream staging_django {
    zone staging_django_zone 64k;
    server staging-django:8000 resolve;
    keepalive 8;
}

upstream staging_next {
    zone staging_next_zone 64k;
    server staging-next:3000 resolve;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.kirillwynn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://staging.kirillwynn.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.kirillwynn.com;

    ssl_certificate /etc/letsencrypt/live/staging.kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.kirillwynn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/auth/staging.htpasswd;
    include /etc/nginx/snippets/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /api/v1/email/webhooks/resend/ {
        auth_basic off;
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
        proxy_request_buffering on;
        add_header Cache-Control "private, no-store" always;
    }

    location = /internal/health {
        return 404;
    }

    location = /api/draft {
        proxy_pass http://staging_next;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/draft/disable {
        proxy_pass http://staging_next;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/revalidate {
        proxy_pass http://staging_next;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/health/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/readiness/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/me/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/logout/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /api/v1/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
        add_header Cache-Control "private, no-store" always;
    }
    location ^~ /accounts/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /cms/ {
        client_max_body_size 25m;
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /django-admin/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /api/ {
        return 404;
    }

    location ~ "^/static/.+\.[0-9a-f]{12}\..+$" {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location /static/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }
    location ^~ /media/documents/ {
        proxy_pass http://staging_django;
        include /etc/nginx/snippets/proxy.conf;
        add_header Cache-Control "private, no-store" always;
    }
    location ^~ /media/ {
        return 404;
    }

    location / {
        proxy_pass http://staging_next;
        include /etc/nginx/snippets/proxy.conf;
    }
}
