upstream production_django {
    zone production_django_zone 64k;
    server production-django:8000 resolve;
    keepalive 16;
}

upstream production_next {
    zone production_next_zone 64k;
    server production-next:3000 resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name kirillwynn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://kirillwynn.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kirillwynn.com;

    ssl_certificate /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /internal/health {
        return 404;
    }

    location = /api/draft {
        proxy_pass http://production_next;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/draft/disable {
        proxy_pass http://production_next;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/revalidate {
        proxy_pass http://production_next;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /api/health/ {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/readiness/ {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/me/ {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/logout/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/signup/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/login/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/verify-email/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/verify-email/resend/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/password/reset/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/password/reset/confirm/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/password/set/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/password/change/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/auth/profile/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    # Canonical Stage 17 browser routes live below the existing versioned API
    # boundary. Exact matches retain the bounded mutation contract without a
    # generic auth proxy; the legacy exact paths above remain rollback-safe.
    location = /api/v1/auth/logout/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/signup/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/login/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/verify-email/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/verify-email/resend/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/password/reset/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/password/reset/confirm/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/password/set/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/password/change/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /api/v1/auth/profile/ {
        client_max_body_size 16k;
        proxy_request_buffering on;
        error_page 413 = @auth_api_body_too_large;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location @auth_api_body_too_large {
        internal;
        client_max_body_size 0;
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header Vary "Cookie" always;
        return 413 '{"detail":"Request body is too large."}';
    }
    location ^~ /api/v1/ {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
        add_header Cache-Control "private, no-store" always;
    }
    location ^~ /accounts/ {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /cms/ {
        client_max_body_size 25m;
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /django-admin/ {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
    }
    location ^~ /api/ {
        return 404;
    }

    location ~ "^/static/.+\.[0-9a-f]{12}\..+$" {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
    location /static/ {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }
    location ^~ /media/documents/ {
        proxy_pass http://production_django;
        include /etc/nginx/snippets/proxy.conf;
        add_header Cache-Control "private, no-store" always;
    }
    location ^~ /media/ {
        return 404;
    }

    location / {
        proxy_pass http://production_next;
        include /etc/nginx/snippets/proxy.conf;
    }
}
