user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $scheme $upstream_forwarded_proto {
        default $scheme;
    }

    log_format structured escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"host":"$host","request":"$request","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout structured;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_body_timeout 15s;
    client_header_timeout 15s;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
