events {}

http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 1s;

    map $scheme $upstream_forwarded_proto {
        default https;
    }

    upstream integration_django {
        zone integration_django_zone 64k;
        server staging-django:8000 resolve;
    }
    upstream integration_next {
        zone integration_next_zone 64k;
        server staging-next:3000 resolve;
    }
    upstream integration_production_django {
        zone integration_production_django_zone 64k;
        server production-django:8080 resolve;
    }
    upstream integration_production_next {
        zone integration_production_next_zone 64k;
        server production-next:8080 resolve;
    }

    server {
        listen 8080;
        server_name staging.test;
        auth_basic "Staging";
        auth_basic_user_file /etc/nginx/auth/integration.htpasswd;
        include /etc/nginx/snippets/security-headers.conf;

        location = /internal/health {
            return 404;
        }
        location = /api/v1/email/webhooks/resend/ {
            auth_basic off;
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
            proxy_request_buffering on;
        }
        location = /api/draft {
            proxy_pass http://integration_next;
            include /etc/nginx/snippets/proxy.conf;
        }
        location = /api/draft/disable {
            proxy_pass http://integration_next;
            include /etc/nginx/snippets/proxy.conf;
        }
        location = /api/revalidate {
            proxy_pass http://integration_next;
            include /etc/nginx/snippets/proxy.conf;
        }
        location = /api/health/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location = /api/readiness/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location = /api/me/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location = /api/auth/logout/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location ^~ /api/v1/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location ^~ /accounts/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location ^~ /cms/ {
            client_max_body_size 25m;
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location ^~ /django-admin/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location ^~ /api/ {
            return 404;
        }
        location ^~ /static/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location ^~ /media/documents/ {
            proxy_pass http://integration_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location ^~ /media/ {
            return 404;
        }
        location / {
            proxy_pass http://integration_next;
            include /etc/nginx/snippets/proxy.conf;
        }
    }

    server {
        listen 8080;
        server_name production.test;

        location = /api/health/ {
            proxy_pass http://integration_production_django;
            include /etc/nginx/snippets/proxy.conf;
        }
        location / {
            proxy_pass http://integration_production_next;
            include /etc/nginx/snippets/proxy.conf;
        }
    }
}
