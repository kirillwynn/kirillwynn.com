# docker-compose.yml
#
# Services:
# - app   : Flask app (Gunicorn), internal-only
# - nginx : Public edge proxy (TLS termination + routing)
#
# Key rule (Docker nginx image best practice):
# - DO NOT mount /etc/nginx/nginx.conf from the repo
# - Put ONLY server blocks into ./nginx/conf.d/*.conf and mount that directory

x-common-env: &common-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

  # S3 / Object Storage (optional feature gate)
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

services:
  app:
    image: ${DOCKER_USERNAME}/kw-app:${IMAGE_TAG:-latest}
    container_name: app

    # Internal-only port (visible only to other containers on the network)
    expose:
      - "5000"

    environment:
      # Flask session signing, etc.
      SECRET_KEY: ${SECRET_KEY}

      # Some Flask tooling expects this (harmless)
      FLASK_APP: app

      <<: *common-env

    restart: always

    networks:
      - default

  nginx:
    image: ${DOCKER_USERNAME}/kw-nginx:${IMAGE_TAG:-latest}
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Mount ONLY server blocks into conf.d
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

      # TLS certificates (Let's Encrypt)
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # ACME webroot for certbot HTTP-01
      - /var/www/certbot:/var/www/certbot

    depends_on:
      - app

    restart: always

    networks:
      - default

networks:
  default:
    name: kw-network
