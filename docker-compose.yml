# docker-compose.yml
#
# This compose file runs two services:
# 1) app   - Flask app served by Gunicorn (internal-only, no public ports)
# 2) nginx - Public edge proxy (TLS termination, routing, headers)
#
# Design goals:
# - Reproducible deploys: images are pulled by immutable tag (IMAGE_TAG = git SHA)
# - Fail-fast config: required env vars must be present (enforced by app config)
# - Single docker network name for predictable service discovery ("kw-network")

# Common environment variables reused by multiple services
x-common-env: &common-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  app:
    # Pull a specific version of the image for reproducible deployments.
    # If IMAGE_TAG is not set, fall back to "latest" (useful for local dev).
    image: ${DOCKER_USERNAME}/kw-app:${IMAGE_TAG:-latest}
    container_name: app

    # Expose port only to other containers on the same Docker network.
    # This keeps the Flask app private behind Nginx.
    expose:
      - "5000"

    environment:
      # Used by Flask for session signing and other crypto.
      SECRET_KEY: ${SECRET_KEY}

      # Kept for compatibility with common Flask tooling / CLI.
      FLASK_APP: app

      # Database configuration (shared block above).
      <<: *common-env

    # Always restart the app container if it crashes or the host reboots.
    restart: always

    networks:
      - default

  nginx:
    # Pull a specific version of the image for reproducible deployments.
    # If IMAGE_TAG is not set, fall back to "latest" (useful for local dev).
    image: ${DOCKER_USERNAME}/kw-nginx:${IMAGE_TAG:-latest}
    container_name: nginx

    # Publish HTTP and HTTPS to the host.
    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Mount the Nginx configuration from the server-side repo checkout.
      # This allows updating routing/headers via git pull without rebuilding the image.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

      # Mount TLS certificates from the host (Let's Encrypt).
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # Webroot for Let's Encrypt ACME HTTP-01 challenges (used by certbot renew)
      - /var/www/certbot:/var/www/certbot

    # Ensure the app container starts before Nginx.
    # Note: does not guarantee app is "ready", only that it has started.
    depends_on:
      - app

    # Always restart the nginx container if it crashes or the host reboots.
    restart: always

    networks:
      - default

networks:
  default:
    # Fixed network name makes service discovery predictable and allows
    # optional cross-compose connectivity if needed later.
    name: kw-network
