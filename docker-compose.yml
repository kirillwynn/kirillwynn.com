services:
  app:
    image: ${DOCKER_USERNAME}/kw-app:latest
    container_name: app
    expose:
      - "5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    restart: always

  nginx:
    image: ${DOCKER_USERNAME}/kw-nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf  # Override default nginx config
      - /etc/letsencrypt:/etc/letsencrypt:ro       # Mount certificates directory
    depends_on:
      - app
    restart: always
