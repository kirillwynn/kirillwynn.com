# docker-compose.yml

x-common-env: &common-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

services:
  app:
    image: ${DOCKER_USERNAME}/kw-app:${IMAGE_TAG:-latest}
    container_name: app
    expose:
      - "5000"

    # OPTIONAL: if present on server
    # (doesn't commit secrets; it's just a convenience for compose)
    env_file:
      - .env

    environment:
      # IMPORTANT: staging/local can boot without DB/SECRET_KEY now
      APP_ENV: ${APP_ENV:-production}

      SECRET_KEY: ${SECRET_KEY}
      FLASK_APP: app

      <<: *common-env

    restart: always

    networks:
      - default

  nginx:
    image: ${DOCKER_USERNAME}/kw-nginx:${IMAGE_TAG:-latest}
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot

    depends_on:
      - app

    restart: always

    networks:
      - default

networks:
  default:
    name: kw-network
