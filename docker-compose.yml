# docker-compose.yml
#
# Services:
# - app: Flask/Gunicorn (internal)
# - nginx: edge proxy (TLS termination, routing)
#
# Design goals:
# - Reproducible deploys with immutable image tags (IMAGE_TAG = git SHA)
# - Fail-fast config enforced by backend Config
# - Predictable network name: kw-network

x-common-env: &common-env
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}

  # S3 / Object Storage (for media uploads)
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

services:
  app:
    image: ${DOCKER_USERNAME}/kw-app:${IMAGE_TAG:-latest}
    container_name: app

    expose:
      - "5000"

    environment:
      SECRET_KEY: ${SECRET_KEY}
      FLASK_APP: app
      <<: *common-env

    restart: always

    networks:
      - default

  nginx:
    image: ${DOCKER_USERNAME}/kw-nginx:${IMAGE_TAG:-latest}
    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # IMPORTANT:
      # Mount the whole nginx folder so we can add per-domain vhost configs
      # (e.g. staging.secretroom.kirillwynn.com.conf) without rebuilding images.
      - ./nginx:/etc/nginx:ro

      # TLS certs from host (Let's Encrypt).
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # Webroot for ACME http-01 challenges (certbot renew).
      - /var/www/certbot:/var/www/certbot

    depends_on:
      - app

    restart: always

    networks:
      - default

networks:
  default:
    name: kw-network
