# docker-compose.yml
#
# This stack runs:
# - app   : Flask/Gunicorn (internal)
# - nginx : public edge reverse proxy (TLS termination, routing)
#
# Design goals:
# - Immutable deploys: images pinned by IMAGE_TAG (git SHA)
# - Runtime config via .env on the server (not committed)
# - Keep app private behind nginx

services:
  app:
    image: ${DOCKER_USERNAME}/kw-app:${IMAGE_TAG:-latest}
    container_name: app
    expose:
      - "5000"
    environment:
      FLASK_APP: app

      # App crypto/session signing
      SECRET_KEY: ${SECRET_KEY}

      # DB (required by Config)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # S3 (optional feature)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

      # Optional bootstrap (create-admin CLI reads these)
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}

      # Environment marker (staging/prod)
      APP_ENV: ${APP_ENV}
    restart: always
    networks:
      - default

  nginx:
    image: ${DOCKER_USERNAME}/kw-nginx:${IMAGE_TAG:-latest}
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"

    # IMPORTANT:
    # - Do NOT mount nginx.conf from host.
    # - Config is shipped inside the nginx image (immutable).
    volumes:
      - type: bind
        source: ./nginx/entrypoint.d
        target: /docker-entrypoint.d
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ./nginx/conf.d
        target: /etc/nginx/conf.d
        read_only: true
        bind:
          create_host_path: true
      - ./frontend/dist:/app/frontend/dist:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot

    depends_on:
      - app
    restart: always
    networks:
      - default

networks:
  default:
    name: kw-network
