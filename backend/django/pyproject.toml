[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kirillwynn-backend"
version = "0.1.0"
description = "Django and Wagtail backend for kirillwynn.com"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.16",
    "django-allauth[socialaccount]==65.18.0",
    "django-treebeard==5.2.0",
    "djangorestframework==3.17.1",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.2.12",
    "Wagtail==7.4.2",
    "wagtail-headless-preview==0.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-django==4.11.1",
    "ruff==0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
