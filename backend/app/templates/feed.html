{% extends "base.html" %}

{% block title %}Feed{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="space-y-4">
        {% for post in posts %}
            <article class="bg-gruvbox-bg0 p-4 rounded shadow hover:border-gruvbox-yellow border border-transparent transition-all">
                <h2 class="text-2xl font-semibold text-white">
                    <a href="{{ url_for('main.post_detail', slug=post.slug) }}" class="hover:text-gruvbox-yellow">{{ post.title }}</a>
                </h2>
                <p class="text-sm text-gruvbox-fg1">Published {{ (post.published_at or post.created_at).strftime('%Y-%m-%d') }}</p>
                <p class="text-gruvbox-fg mt-2">{{ excerpt(post.body_md) }}</p>
                <a href="{{ url_for('main.post_detail', slug=post.slug) }}" class="inline-block mt-3 text-gruvbox-yellow hover:text-yellow-400">Read more →</a>
            </article>
        {% endfor %}
    </div>
</div>
{% endblock %}
