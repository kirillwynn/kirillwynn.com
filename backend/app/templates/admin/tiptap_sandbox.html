<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TipTap Sandbox</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        padding: 24px;
      }

      #tiptap-editor {
        border: 1px solid #999;
        padding: 12px;
        min-height: 200px;
      }

      .ProseMirror {
        outline: none;
        min-height: 200px;
      }

      #status {
        margin-bottom: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>TipTap Sandbox</h1>
    <p>This page isolates the TipTap editor without project styles.</p>
    <div id="status">Loading TipTap...</div>
    <div id="tiptap-error" style="display: none; margin-bottom: 12px; padding: 12px; border: 1px solid #b00020; background: #ffd8e0; color: #4a0010; white-space: pre-wrap;"></div>
    <div id="tiptap-editor"><div id="tiptap-loading">Loading editor…</div></div>

    <script type="module">
      const status = document.getElementById("status");
      const editorElement = document.getElementById("tiptap-editor");
      const loadingElement = document.getElementById("tiptap-loading");
      const errorBox = document.getElementById("tiptap-error");

      const showError = (error) => {
        if (errorBox) {
          errorBox.style.display = "block";
          const message = error?.message || String(error);
          const stack = error?.stack ? `\n\n${error.stack}` : "";
          errorBox.textContent = `${message}${stack}`;
        }
        if (status) {
          status.textContent = "Failed to load TipTap";
          status.style.color = "#b00020";
        }
        if (loadingElement?.parentNode) {
          loadingElement.remove();
        }
      };

      const showReady = (message) => {
        if (status) {
          status.textContent = message;
          status.style.color = "#0a7b1f";
        }
        if (loadingElement?.parentNode) {
          loadingElement.remove();
        }
      };

      (async () => {
        try {
          const { Editor } = await import("https://esm.sh/@tiptap/core@2.6.6");
          const { default: StarterKit } = await import("https://esm.sh/@tiptap/starter-kit@2.6.6");

          new Editor({
            element: editorElement,
            extensions: [StarterKit],
            content: "<p>Hello from TipTap sandbox. Click and type here.</p>",
          });

          showReady("TipTap loaded. Click inside the box to edit.");
        } catch (error) {
          showError(error);
        }
      })();
    </script>
  </body>
</html>
