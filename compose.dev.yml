services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kirillwynn}
      POSTGRES_USER: ${POSTGRES_USER:-kirillwynn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    command:
      - sh
      - -c
      - python manage.py migrate && python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      WAGTAIL_ADMIN_BASE_URL: ${WAGTAIL_ADMIN_BASE_URL:-http://localhost:8000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      FRONTEND_PREVIEW_URL: ${FRONTEND_PREVIEW_URL:-http://localhost:3000/api/draft}
      REVALIDATION_URL: ${REVALIDATION_URL:-http://next:3000/api/revalidate}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-local-revalidation-secret-at-least-32-bytes}
      EMAIL_PROVIDER_ADAPTER: apps.subscriptions.providers.memory.MemoryEmailProvider
      EMAIL_PROVIDER_IDEMPOTENCY_NAMESPACE: local/development
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-Kirill Wynn <posts@localhost>}
      SUBSCRIPTION_SIGNING_SECRET: ${SUBSCRIPTION_SIGNING_SECRET:-local-subscription-signing-secret-32-bytes}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SITE_OWNER_EMAIL: ${SITE_OWNER_EMAIL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kirillwynn}
      POSTGRES_USER: ${POSTGRES_USER:-kirillwynn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/django:/app

  next:
    image: node:24-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0
    environment:
      DJANGO_API_URL: http://django:8000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-local-revalidation-secret-at-least-32-bytes}
    depends_on:
      django:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend/next:/app
      - next_node_modules:/app/node_modules

  worker:
    profiles:
      - worker
    build:
      context: .
      dockerfile: backend/django/Dockerfile
    command:
      - python
      - manage.py
      - run_worker
      - --heartbeat-file
      - /tmp/kirillwynn-worker/heartbeat.json
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      REVALIDATION_URL: http://next:3000/api/revalidate
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-local-revalidation-secret-at-least-32-bytes}
      EMAIL_PROVIDER_ADAPTER: apps.subscriptions.providers.memory.MemoryEmailProvider
      EMAIL_PROVIDER_IDEMPOTENCY_NAMESPACE: local/development
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-Kirill Wynn <posts@localhost>}
      SUBSCRIPTION_SIGNING_SECRET: ${SUBSCRIPTION_SIGNING_SECRET:-local-subscription-signing-secret-32-bytes}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-kirillwynn}
      POSTGRES_USER: ${POSTGRES_USER:-kirillwynn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/django:/app

volumes:
  postgres_data:
  next_node_modules:
