name: Staging server preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: kirillwynn-server-release-operations
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
      SERVER_HOST: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require deployment to remain disabled
        run: test "$STAGING_DEPLOY_ENABLED" != true
      - name: Verify staging host boundary
        run: infra/scripts/ci_ssh_preflight.sh
