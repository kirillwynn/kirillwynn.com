name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rewrite/wagtail-next

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install uv==0.11.32
      - working-directory: backend/django
        run: |
          uv sync --frozen
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
          uv run pytest -m "not postgresql"
      - name: Production settings check
        working-directory: backend/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-django-secret-not-for-runtime-32-bytes-unique-12345
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          POSTGRES_HOST: db
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: production-check-only
          WAGTAIL_ADMIN_BASE_URL: https://example.com/cms
          PUBLIC_SITE_URL: https://example.com
          FRONTEND_PREVIEW_URL: https://example.com/api/draft
          REVALIDATION_URL: https://example.com/api/revalidate
          REVALIDATION_SECRET: ci-revalidation-secret-at-least-32-bytes
          SUBSCRIPTION_SIGNING_SECRET: ci-subscription-secret-at-least-32-bytes
          EMAIL_PROVIDER_ADAPTER: apps.subscriptions.providers.memory.MemoryEmailProvider
          EMAIL_PROVIDER_IDEMPOTENCY_NAMESPACE: memory/ci
          EMAIL_FROM_ADDRESS: CI <ci@example.com>
          S3_MEDIA_ACCESS_KEY_ID: ci-access
          S3_MEDIA_SECRET_ACCESS_KEY: ci-secret
          S3_MEDIA_BUCKET: ci-media
          S3_MEDIA_PREFIX: ci/media
          S3_MEDIA_ENDPOINT_URL: https://s3.example.com
          S3_MEDIA_REGION: us-east-1
          S3_MEDIA_ADDRESSING_STYLE: virtual
          S3_MEDIA_PUBLIC_ORIGIN: https://media.example.com
          GOOGLE_OAUTH_CLIENT_ID: google-ci
          GOOGLE_OAUTH_CLIENT_SECRET: google-ci-secret
          GITHUB_OAUTH_CLIENT_ID: github-ci
          GITHUB_OAUTH_CLIENT_SECRET: github-ci-secret
        run: uv run python manage.py check --deploy

  backend-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: kirillwynn_test
          POSTGRES_USER: kirillwynn_test
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kirillwynn_test -d kirillwynn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DJANGO_TEST_DATABASE_ENGINE: postgresql
      DJANGO_TEST_DATABASE: test_kirillwynn
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: kirillwynn_test
      POSTGRES_USER: kirillwynn_test
      POSTGRES_PASSWORD: postgres-ci-only
      POSTGRES_SSLMODE: disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install uv==0.11.32
      - name: PostgreSQL suite and migration direction checks
        working-directory: backend/django
        run: |
          uv sync --frozen
          PYTEST_FAIL_ON_SKIP=1 uv run pytest -m postgresql
          PYTEST_FAIL_ON_SKIP=1 uv run pytest -m "not postgresql"
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate subscriptions 0002 --noinput
          uv run python manage.py migrate subscriptions --noinput
          uv run python manage.py migrate discussions 0001 --noinput
          uv run python manage.py migrate discussions --noinput
          uv run python manage.py makemigrations --check --dry-run

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/next/package-lock.json
      - working-directory: frontend/next
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - run: node infra/tests/verify-next-runtime-origins.mjs frontend/next/.next/standalone
      - name: Scan browser assets
        run: |
          ! grep -R -E \
            'DJANGO_API_URL|REVALIDATION_SECRET|RESEND_API_KEY|RESEND_WEBHOOK_SECRET|SUBSCRIPTION_SIGNING_SECRET|POSTGRES_PASSWORD|S3_MEDIA_SECRET_ACCESS_KEY|OAUTH_CLIENT_SECRET|http://django:8000|postgres sentinel|django sentinel|s3-only-integration-secret|google-only-integration-secret|github-only-integration-secret' \
            frontend/next/.next/static

  browser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/next/package-lock.json
      - working-directory: frontend/next
        run: npm ci
      - working-directory: frontend/next
        run: npx playwright install --with-deps chromium
      - id: e2e
        continue-on-error: true
        working-directory: frontend/next
        run: npm run test:browser-contract
      - id: artifacts
        name: Sanitize and recheck retained browser artifacts
        if: always()
        run: |
          infra/tests/scan_test_artifacts.sh --remove-unsafe frontend/next/test-results
          infra/tests/scan_test_artifacts.sh --remove-unsafe frontend/next/playwright-report
          infra/tests/scan_test_artifacts.sh frontend/next/test-results
          infra/tests/scan_test_artifacts.sh frontend/next/playwright-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: >-
          always() &&
          steps.e2e.outcome == 'failure' &&
          steps.artifacts.outcome == 'success'
        with:
          name: browser-contract-failure-${{ github.sha }}
          path: |
            frontend/next/test-results
            frontend/next/playwright-report
          if-no-files-found: error
          retention-days: 7
      - name: Enforce Playwright result
        if: always()
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.e2e.outcome }}
          ARTIFACT_BOUNDARY_OUTCOME: ${{ steps.artifacts.outcome }}
        run: |
          test "$ARTIFACT_BOUNDARY_OUTCOME" = success
          test "$PLAYWRIGHT_OUTCOME" = success

  cross-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install uv==0.11.32
      - working-directory: backend/django
        run: uv sync --frozen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/next/package-lock.json
      - working-directory: frontend/next
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - id: e2e
        continue-on-error: true
        working-directory: frontend/next
        run: npm run test:cross-stack
      - id: artifacts
        name: Sanitize and recheck retained browser artifacts
        if: always()
        run: |
          infra/tests/scan_test_artifacts.sh --remove-unsafe frontend/next/test-results
          infra/tests/scan_test_artifacts.sh --remove-unsafe frontend/next/playwright-report
          infra/tests/scan_test_artifacts.sh frontend/next/test-results
          infra/tests/scan_test_artifacts.sh frontend/next/playwright-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: >-
          always() &&
          steps.e2e.outcome == 'failure' &&
          steps.artifacts.outcome == 'success'
        with:
          name: cross-stack-failure-${{ github.sha }}
          path: |
            frontend/next/test-results
            frontend/next/playwright-report
          if-no-files-found: error
          retention-days: 7
      - name: Enforce cross-stack and artifact results
        if: always()
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.e2e.outcome }}
          ARTIFACT_BOUNDARY_OUTCOME: ${{ steps.artifacts.outcome }}
        run: |
          test "$ARTIFACT_BOUNDARY_OUTCOME" = success
          test "$PLAYWRIGHT_OUTCOME" = success

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install pytest==8.4.2
      - name: Static script and infrastructure regression checks
        env:
          PYTHONPYCACHEPREFIX: /tmp/kirillwynn-pyc
        run: |
          find infra/scripts infra/tests -type f -name '*.sh' -exec sh -n {} +
          python -m compileall -q infra/scripts infra/tests
          python -m pytest infra/tests
      - name: All Compose contracts
        run: |
          infra/scripts/require_compose_version.sh
          docker compose --env-file infra/env/staging.control.env.example -f infra/compose/application.yml config --format json > /tmp/staging.json
          docker compose --env-file infra/env/production.control.env.example -f infra/compose/application.yml config --format json > /tmp/production.json
          docker compose --env-file infra/env/staging.control.env.example -f infra/compose/database.yml config >/dev/null
          docker compose --env-file infra/env/production.control.env.example -f infra/compose/database.yml config >/dev/null
          python infra/tests/verify_compose_isolation.py /tmp/staging.json /tmp/production.json
          docker compose --env-file infra/env/edge.env.example -f infra/compose/edge.yml config >/dev/null
          docker compose -f infra/compose/integration.yml config >/dev/null
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build production images
        run: |
          docker build -f backend/django/Dockerfile -t kirillwynn-django:ci .
          docker build -f frontend/next/Dockerfile -t kirillwynn-next:ci .
          docker build -f infra/docker/edge.Dockerfile -t kirillwynn-edge:ci .
      - name: Nginx configuration
        run: infra/tests/nginx_config_test.sh kirillwynn-edge:ci
      - name: Container integration smoke
        run: infra/tests/container_smoke.sh

  ci-required:
    if: always()
    needs:
      - backend-sqlite
      - backend-postgresql
      - frontend
      - browser-contract
      - cross-stack
      - infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Require every Milestone 11 gate
        env:
          BACKEND_SQLITE: ${{ needs.backend-sqlite.result }}
          BACKEND_POSTGRESQL: ${{ needs.backend-postgresql.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER_CONTRACT: ${{ needs['browser-contract'].result }}
          CROSS_STACK: ${{ needs['cross-stack'].result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
        run: |
          test "$BACKEND_SQLITE" = success
          test "$BACKEND_POSTGRESQL" = success
          test "$FRONTEND" = success
          test "$BROWSER_CONTRACT" = success
          test "$CROSS_STACK" = success
          test "$INFRASTRUCTURE" = success
