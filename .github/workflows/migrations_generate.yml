name: Migrations – Generate 

on:
  workflow_dispatch:

jobs:
  generate-migrations:
    runs-on: ubuntu-latest
    env:
      FLASK_APP: app
      FLASK_ENV: production
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TELEGRAM_WEBHOOK_TOKEN: ${{ secrets.TELEGRAM_WEBHOOK_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: |
          cd backend
          poetry install

      - name: Run migration
        run: |
          cd backend
          poetry run flask db migrate -m "Manual migration"

      - name: Check for changes
        id: changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add backend/migrations/versions || true
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push migration
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "Manual migration from GitHub Actions"
          git push
