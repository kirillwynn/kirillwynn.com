name: Build and Deploy

on:
  # Automatic deploy on push to main branch
  push:
    branches:
      - main

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  # -------------------------------------------------
  # Build & push Nginx image (edge / reverse proxy)
  # -------------------------------------------------
  build-and-push-nginx:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository so Docker build has full context
      - name: Checkout code
        uses: actions/checkout@v4

      # Enable Docker Buildx (modern builder with caching support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push Nginx image
      # Two tags are published:
      # - latest: convenience tag
      # - github.sha: immutable, reproducible release artifact
      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.nginx
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kw-nginx:latest
            ${{ secrets.DOCKER_USERNAME }}/kw-nginx:${{ github.sha }}

  # -------------------------------------------------
  # Build & push Flask application image
  # -------------------------------------------------
  build-and-push-flask:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository so Docker build has full context
      - name: Checkout code
        uses: actions/checkout@v4

      # Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push Flask/Gunicorn image
      - name: Build and push Flask image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kw-app:latest
            ${{ secrets.DOCKER_USERNAME }}/kw-app:${{ github.sha }}

  # -------------------------------------------------
  # Deploy to staging environment
  # -------------------------------------------------
  deploy:
    # Deploy only after both images are built and pushed
    needs: [build-and-push-nginx, build-and-push-flask]
    runs-on: ubuntu-latest

    # Bind this job to the "kw_staging" GitHub Environment
    # This enables environment-specific secrets, variables, and approvals
    environment: kw_staging

    steps:
      # Checkout is not strictly required for SSH deploy,
      # but keeps workflow consistent and debuggable
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH into the server and perform the deployment
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            # Move to the project directory on the server
            cd ~/projects/kirillwynn.com

            # Update repository (nginx configs, compose file, etc.)
            git pull origin main

            # -------------------------------------------------
            # Generate .env file for docker-compose
            # This file is NOT committed and exists only on the server
            # -------------------------------------------------
            cat > .env <<EOF
            APP_ENV=${{ vars.APP_ENV }}
            DOCKER_USERNAME=${{ vars.DOCKER_USERNAME }}
            IMAGE_TAG=${{ github.sha }}

            SECRET_KEY=${{ secrets.SECRET_KEY }}

            DB_HOST=${{ vars.DB_HOST }}
            DB_PORT=${{ vars.DB_PORT }}
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            S3_ENDPOINT_URL=${{ vars.S3_ENDPOINT_URL }}
            S3_REGION=${{ vars.S3_REGION }}
            S3_BUCKET=${{ vars.S3_BUCKET }}
            S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
            S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
            EOF

            # Restrict permissions (defense-in-depth)
            chmod 600 .env

            # Authenticate Docker on the server
            docker login -u ${{ vars.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            # Pull exact images for this commit (immutable deploy)
            docker pull ${{ vars.DOCKER_USERNAME }}/kw-nginx:${{ github.sha }}
            docker pull ${{ vars.DOCKER_USERNAME }}/kw-app:${{ github.sha }}

            # Apply database migrations before starting new containers
            docker compose run --rm app flask db upgrade

            # Start/update the stack
            docker compose up -d --remove-orphans

            # Basic sanity output (non-fatal)
            docker compose ps || true
