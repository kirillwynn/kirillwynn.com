name: Build and Deploy

on:
  # Automatic deploy on push to main branch
  push:
    branches:
      - main

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  # ----------------------------
  # Build & push Nginx image
  # ----------------------------
  build-and-push-nginx:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository so Docker build has full context
      - name: Checkout code
        uses: actions/checkout@v4

      # Enable Docker Buildx (modern builder with caching support)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push Nginx image
      # Two tags are published:
      # - latest: convenience tag
      # - github.sha: immutable, reproducible release artifact
      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.nginx
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kw-nginx:latest
            ${{ secrets.DOCKER_USERNAME }}/kw-nginx:${{ github.sha }}

  # ----------------------------
  # Build & push Flask app image
  # ----------------------------
  build-and-push-flask:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository so Docker build has full context
      - name: Checkout code
        uses: actions/checkout@v4

      # Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push Flask/Gunicorn image
      - name: Build and push Flask image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kw-app:latest
            ${{ secrets.DOCKER_USERNAME }}/kw-app:${{ github.sha }}

  # ----------------------------
  # Deploy to production server
  # ----------------------------
  deploy:
    # Deploy only after both images are built and pushed
    needs: [build-and-push-nginx, build-and-push-flask]
    runs-on: ubuntu-latest
    steps:
      # Checkout is not strictly required for SSH deploy,
      # but keeps workflow consistent and debuggable
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH into the production server and deploy
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Move to the project directory on the server
            # (used for docker-compose.yml, nginx.conf, etc.)
            cd ~/projects/kirillwynn.com
            git pull origin main

            # Docker image owner and immutable release tag
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export IMAGE_TAG=${{ github.sha }}

            # Authenticate Docker on the server
            docker login -u $DOCKER_USERNAME -p ${{ secrets.DOCKER_PASSWORD }}

            # Pull exact images for this commit (reproducible deploy)
            docker pull $DOCKER_USERNAME/kw-nginx:$IMAGE_TAG
            docker pull $DOCKER_USERNAME/kw-app:$IMAGE_TAG

            # Export required application configuration
            # These are consumed by docker-compose.yml
            export SECRET_KEY=${{ secrets.SECRET_KEY }}
            export DB_HOST=${{ secrets.DB_HOST }}
            export DB_PORT=${{ secrets.DB_PORT }}
            export DB_NAME=${{ secrets.DB_NAME }}
            export DB_USER=${{ secrets.DB_USER }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            # Apply database migrations BEFORE starting the new version
            # This ensures schema and code stay in sync
            docker compose run --rm app flask db upgrade

            # Start/update the stack using the pulled images
            # --remove-orphans cleans up containers no longer defined
            docker compose up -d --remove-orphans

