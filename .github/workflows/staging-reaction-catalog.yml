name: Staging reaction catalog sync

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sync-staging-catalog:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: kirillwynn-server-release-operations
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_GATE: ${{ vars.STAGING_REACTION_CATALOG_SYNC_ENABLED }}
      DEPLOY_GATE: ${{ vars.STAGING_DEPLOY_ENABLED }}
      CATALOG_ASSET_ID: ${{ vars.STAGING_REACTION_CATALOG_ASSET_ID }}
      EXPECTED_ENCRYPTED_ARCHIVE_SHA256: ${{ vars.STAGING_REACTION_CATALOG_ENCRYPTED_SHA256 }}
      EXPECTED_ARCHIVE_SHA256: ${{ vars.STAGING_REACTION_CATALOG_ARCHIVE_SHA256 }}
      EXPECTED_MANIFEST_SHA256: ${{ vars.STAGING_REACTION_CATALOG_MANIFEST_SHA256 }}
      EXPECTED_ATTESTATION_SHA256: ${{ vars.STAGING_REACTION_CATALOG_ATTESTATION_SHA256 }}
      EXPECTED_ACTIVE_RELEASE_SHA: ${{ vars.STAGING_REACTION_CATALOG_BASE_RELEASE_SHA }}
      TRANSFER_KEY: ${{ secrets.STAGING_REACTION_CATALOG_TRANSFER_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Enforce staging-only sync boundaries
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/rewrite/wagtail-next
          test "$SYNC_GATE" = true
          test "$DEPLOY_GATE" = false
          case "$CATALOG_ASSET_ID" in
            *[!0-9]*|"") exit 2 ;;
          esac
          case "$EXPECTED_ACTIVE_RELEASE_SHA" in
            *[!0-9a-f]*|"") exit 2 ;;
          esac
          test "${#EXPECTED_ACTIVE_RELEASE_SHA}" -eq 40
          for digest in \
            "$EXPECTED_ENCRYPTED_ARCHIVE_SHA256" \
            "$EXPECTED_ARCHIVE_SHA256" \
            "$EXPECTED_MANIFEST_SHA256" \
            "$EXPECTED_ATTESTATION_SHA256"
          do
            case "$digest" in
              *[!0-9a-f]*|"") exit 2 ;;
            esac
            test "${#digest}" -eq 64
          done
          case "$TRANSFER_KEY" in
            *[!0-9a-f]*|"") exit 2 ;;
          esac
          test "${#TRANSFER_KEY}" -eq 64
      - name: Download, decrypt, and safely extract the attested transfer
        run: |
          cipher_path="$RUNNER_TEMP/reaction-catalog-transfer.tar.gz.enc"
          archive_path="$RUNNER_TEMP/reaction-catalog-transfer.tar.gz"
          key_path="$RUNNER_TEMP/reaction-catalog-transfer.key"
          trap 'rm -f "$cipher_path" "$key_path"' EXIT
          umask 077
          printf '%s' "$TRANSFER_KEY" > "$key_path"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$CATALOG_ASSET_ID" \
            > "$cipher_path"
          test "$(sha256sum "$cipher_path" | cut -d ' ' -f 1)" = \
            "$EXPECTED_ENCRYPTED_ARCHIVE_SHA256"
          openssl enc -d -aes-256-ctr -pbkdf2 -iter 200000 -md sha256 \
            -pass file:"$key_path" \
            -in "$cipher_path" \
            -out "$archive_path"
          test "$(sha256sum "$archive_path" | cut -d ' ' -f 1)" = \
            "$EXPECTED_ARCHIVE_SHA256"
          python infra/scripts/extract_catalog_transfer.py \
            "$archive_path" \
            "$RUNNER_TEMP/reaction-catalog-input"
          install -m 0600 \
            docs/reaction-catalog/stage16-staging-v1.json \
            "$RUNNER_TEMP/reaction-catalog-input/stage16-staging-v1.json"
      - name: Upload, verify, activate, and repeat the staging catalog sync
        run: |
          infra/scripts/ci_ssh_catalog_sync.sh \
            "$RUNNER_TEMP/reaction-catalog-input" \
            "$RUNNER_TEMP/reaction-catalog-results"
      - name: Validate and attest the completed sync
        run: |
          python infra/scripts/create_catalog_sync_attestation.py \
            --upload "$RUNNER_TEMP/reaction-catalog-results/upload.txt" \
            --activate "$RUNNER_TEMP/reaction-catalog-results/activate.txt" \
            --idempotent "$RUNNER_TEMP/reaction-catalog-results/idempotent.txt" \
            --output staging-reaction-catalog-attestation.json \
            --release-sha "$EXPECTED_ACTIVE_RELEASE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --archive-sha256 "$EXPECTED_ARCHIVE_SHA256" \
            --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --catalog-attestation-sha256 "$EXPECTED_ATTESTATION_SHA256"
          sha256sum staging-reaction-catalog-attestation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-reaction-catalog-attestation-${{ github.sha }}
          path: staging-reaction-catalog-attestation.json
          if-no-files-found: error
          retention-days: 90
