# staging.secretroom.https.conf
#
# Optional HTTPS vhost for staging.
# This file MUST NOT be placed directly into /etc/nginx/conf.d unless
# the certificate exists. It is enabled by /docker-entrypoint.d script.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name staging.secretroom.kirillwynn.com;

    ssl_certificate     /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Keep it simple + safe: nginx expects this directive as a single argument string.
    ssl_ciphers
        ECDHE-ECDSA-AES256-GCM-SHA384:
        ECDHE-RSA-AES256-GCM-SHA384:
        ECDHE-ECDSA-CHACHA20-POLY1305:
        ECDHE-RSA-CHACHA20-POLY1305:
        ECDHE-ECDSA-AES128-GCM-SHA256:
        ECDHE-RSA-AES128-GCM-SHA256;

    # Staging-friendly security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ACME challenge on HTTPS too (some validators hit HTTPS)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    location / {
        add_header Content-Type text/plain;
        return 200 "staging.secretroom.kirillwynn.com (https) — alive\n";
    }
}
