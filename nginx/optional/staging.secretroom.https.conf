# staging.secretroom.https.conf
#
# HTTPS vhost for staging.secretroom.kirillwynn.com
# - Terminates TLS
# - Proxies API (/api/*) to Flask (app:5000)
# - Keeps a simple placeholder for / (until SPA is wired)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name staging.secretroom.kirillwynn.com;

    # Certificates (created by certbot on the host)
    ssl_certificate     /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/privkey.pem;

    # Modern TLS
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # IMPORTANT: keep this in one directive, one string, one semicolon
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------
    # ACME challenge on HTTPS (some validators hit HTTPS directly)
    # --------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    # --------------------------------------------------------
    # API -> Flask (this is what your "Ping API" must hit)
    # --------------------------------------------------------
    location ^~ /api/ {
        proxy_pass http://app:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------
    # Placeholder root (until we serve the frontend build here)
    # --------------------------------------------------------
    location / {
        add_header Content-Type text/plain;
        return 200 "staging.secretroom.kirillwynn.com (https) — nginx is alive\n";
    }
}
