# staging.secretroom.https.conf
#
# Optional HTTPS vhost for staging.secretroom.kirillwynn.com.
# This file is copied into /etc/nginx/conf.d ONLY when the certificate exists.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name staging.secretroom.kirillwynn.com;

    ssl_certificate     /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # IMPORTANT: single argument (string)
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' http://localhost:5173 https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://kirillwynn.com https://staging.secretroom.kirillwynn.com; font-src 'self' data:;" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    location / {
        add_header Content-Type text/plain;
        return 200 "staging.secretroom.kirillwynn.com (https) — alive\n";
    }
}
