events {
    worker_connections 1024;
}

http {
    # Зона лимита запросов для защиты от DDoS
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Карта для блокировки нежелательных user-agent'ов
    map $http_user_agent $block_bot {
        default 0;
        "~*(bot|crawler|spider|scanner|curl)" 1;
    }

    # Перенаправление с HTTP на HTTPS (всегда на канонический домен)
    server {
        listen 80;
        listen [::]:80;
        server_name kirillwynn.com www.kirillwynn.com;
        return 301 https://kirillwynn.com$request_uri;
    }

    # Перенаправление с www на основной домен через HTTPS
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.kirillwynn.com;

        ssl_certificate /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:\
ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:\
ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:\
ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:\
ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256";

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        return 301 https://kirillwynn.com$request_uri;
    }

    # Основной HTTPS сервер для kirillwynn.com
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name kirillwynn.com;

        ssl_certificate /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:\
ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:\
ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:\
ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:\
ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256";

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # Заголовки безопасности
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # Блокировка нежелательных user-agent'ов с помощью map
        if ($block_bot = 1) {
            return 403;
        }

        # Включение сжатия Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;

        # Кэширование статических файлов
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;
        }

        # Заглушка для /webhook
        location /webhook {
            return 200 "Nginx is working, app not yet implemented";
        }

        # Основной блок для проксирования запросов к Flask-приложению
        location / {
            limit_req zone=mylimit burst=20;
            proxy_pass http://flask_app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        location = /404.html {
            return 404 "Not Found";
        }

        # Логирование
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;
    }
}
