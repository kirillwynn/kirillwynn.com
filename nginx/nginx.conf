# Nginx config for kirillwynn.com
# - Terminates TLS (HTTPS)
# - Redirects to canonical domain (https://kirillwynn.com)
# - Adds basic security headers
# - Applies simple rate limiting
# - Proxies all traffic to the Flask/Gunicorn container "app" inside the Docker network
#
# NOTE (Let's Encrypt):
# We serve ACME HTTP-01 challenge files on BOTH HTTP (:80) and HTTPS (:443).
# In practice, the CA may follow redirects / use canonical HTTPS and request:
#   https://kirillwynn.com/.well-known/acme-challenge/<token>
# If this path is not served on HTTPS, certbot webroot validation can fail with 404.

events {
    # Max concurrent connections per worker process.
    worker_connections 1024;
}

http {
    # -----------------------------
    # Basic anti-abuse protections
    # -----------------------------

    # Rate limiting zone:
    # - Key: client IP address in binary form (efficient memory usage)
    # - Storage: 10MB shared memory (enough for many IPs)
    # - Rate: 10 requests/second per IP (applied in location / below)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Map user-agents to a flag that indicates unwanted/bot traffic.
    # If UA matches the regex, $block_bot becomes 1, otherwise 0.
    map $http_user_agent $block_bot {
        default 0;
        "~*(bot|crawler|spider|scanner|curl)" 1;
    }

    # -----------------------------
    # HTTP -> HTTPS + canonical host
    # -----------------------------

    # Redirect ALL HTTP requests (kirillwynn.com and www) to canonical HTTPS.
    server {
        listen 80;
        listen [::]:80;
        server_name kirillwynn.com www.kirillwynn.com;

        # Serve Let's Encrypt ACME HTTP-01 challenge files for automatic certificate renewal.
        # This location MUST be present on port 80 and MUST appear before the HTTPS redirect.
        # The CA will request:
        #   http://<domain>/.well-known/acme-challenge/<token>
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            allow all;
        }

        # Preserve path + query string while moving to HTTPS canonical.
        return 301 https://kirillwynn.com$request_uri;
    }

    # Redirect HTTPS requests for the www host to canonical HTTPS.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.kirillwynn.com;

        # Enable HTTP/2.
        http2 on;

        # TLS certificates from Let's Encrypt (mounted into the container).
        ssl_certificate     /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;

        # Prefer modern TLS.
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Allowed cipher suites (kept from your original config).
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256";

        # OCSP stapling to speed up TLS handshakes.
        ssl_stapling on;
        ssl_stapling_verify on;

        # DNS resolvers for stapling verification.
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # Redirect to canonical domain while preserving path + query.
        return 301 https://kirillwynn.com$request_uri;
    }

    # -----------------------------
    # Main HTTPS server (canonical)
    # -----------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name kirillwynn.com;

        http2 on;

        # TLS certificates from Let's Encrypt (mounted into the container).
        ssl_certificate     /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;

        # Prefer modern TLS.
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Allowed cipher suites (kept from your original config).
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256";

        # OCSP stapling to speed up TLS handshakes.
        ssl_stapling on;
        ssl_stapling_verify on;

        # DNS resolvers for stapling verification.
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # -----------------------------
        # Security headers
        # -----------------------------

        # HSTS: force HTTPS for 1 year on this domain and all subdomains.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Prevent MIME sniffing.
        add_header X-Content-Type-Options "nosniff" always;

        # Conservative referrer policy.
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Clickjacking protection (allow framing only by same origin).
        add_header X-Frame-Options "SAMEORIGIN" always;

        # CSP: allow scripts only from self + Tailwind CDN + esm.sh
        # NOTE: adjust these sources if you move to bundling assets locally.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;" always;

        # -----------------------------
        # Let's Encrypt ACME challenge
        # -----------------------------
        # Serve Let's Encrypt ACME HTTP-01 challenge files on HTTPS too.
        # Some validations will hit the canonical HTTPS URL directly and fail if this is missing.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            allow all;
        }

        # -----------------------------
        # Block unwanted user-agents
        # -----------------------------

        # If the UA was classified as a bot by the map above, reject early.
        if ($block_bot = 1) {
            return 403;
        }

        # -----------------------------
        # Compression
        # -----------------------------
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;

        # -----------------------------
        # Static assets (proxied to Flask)
        # -----------------------------
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;

            proxy_pass http://app:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -----------------------------
        # Webhook endpoint
        # -----------------------------
        location /webhook {
            proxy_pass http://app:5000/webhook;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -----------------------------
        # Main app (everything else)
        # -----------------------------
        location / {
            limit_req zone=mylimit burst=20;

            proxy_pass http://app:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -----------------------------
        # Errors
        # -----------------------------
        error_page 404 /404.html;
        location = /404.html {
            return 404 "Not Found";
        }

        # -----------------------------
        # Logging
        # -----------------------------
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;
    }
}
