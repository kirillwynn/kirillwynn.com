events {
    worker_connections 1024;
}

http {
    # Лимиты запросов для защиты от DDoS
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Перенаправление с HTTP на HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name kirillwynn.com www.kirillwynn.com;
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # Перенаправление с www на основной домен через HTTPS
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.kirillwynn.com;
        http2 on;

        ssl_certificate /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256";

        # Включение OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        return 301 https://kirillwynn.com$request_uri;
    }

    # Основной HTTPS сервер для kirillwynn.com
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name kirillwynn.com;
        http2 on;

        ssl_certificate /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256";

        # Включение OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # HSTS - заставляет браузеры использовать HTTPS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Дополнительные заголовки безопасности
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer-when-downgrade;

        # Защита от ботов
        if ($http_user_agent ~* (bot|crawler|spider|scanner|curl)) {
            return 403;
        }

        # Включение сжатия Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;

        # Улучшенное кэширование статических файлов
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # Заглушка для /webhook
        location /webhook {
            return 200 "Nginx is working, app not yet implemented";
        }

        # Лимиты запросов для защиты от DDoS
        location / {
            limit_req zone=mylimit burst=20;
        }

        # Обработка ошибок
        error_page 404 /404.html;
        location = /404.html {
            return 404 "Not Found";
        }

        # Логирование
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;
    }
}