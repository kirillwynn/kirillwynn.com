events {
    worker_connections 1024;
}

http {
    # Request rate limiting to mitigate DDoS attacks
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Map to block unwanted user-agents (bots)
    map $http_user_agent $block_bot {
        default 0;
        "~*(bot|crawler|spider|scanner|curl)" 1;
    }

    # Redirect HTTP requests to HTTPS on the canonical domain
    server {
        listen 80;
        listen [::]:80;
        server_name kirillwynn.com www.kirillwynn.com;
        return 301 https://kirillwynn.com$request_uri;
    }

    # Redirect www HTTPS requests to the canonical domain
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name www.kirillwynn.com;
        http2 on;

        ssl_certificate /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256";
        
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        return 301 https://kirillwynn.com$request_uri;
    }

    # Main HTTPS server for canonical domain
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name kirillwynn.com;
        http2 on;

        ssl_certificate /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256";
        
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # Block unwanted user-agents using the map
        if ($block_bot = 1) {
            return 403;
        }

        # Enable gzip compression for various content types
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;

        # Cache static files for 30 days
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;
        }

        # Static endpoint for webhook testing
        location /webhook {
            return 200 "Nginx is working, app not yet implemented";
        }

        # Main proxy pass to the Flask app
        location / {
            limit_req zone=mylimit burst=20;
            proxy_pass http://app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Custom error page for 404 errors
        error_page 404 /404.html;
        location = /404.html {
            return 404 "Not Found";
        }

        # Access and error logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;
    }
}
