# staging.secretroom.kirillwynn.com.conf
#
# Staging vhost:
# - Port 80: serve ACME challenge + redirect to HTTPS
# - Port 443: temporary placeholder until we start serving the frontend

server {
    listen 80;
    listen [::]:80;

    server_name staging.secretroom.kirillwynn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.secretroom.kirillwynn.com;

    http2 on;

    ssl_certificate     /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Minimal sane TLS/session settings (fine for staging)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Content-Type text/plain;

    location / {
        return 200 "staging.secretroom is alive (nginx)\n";
    }
}
