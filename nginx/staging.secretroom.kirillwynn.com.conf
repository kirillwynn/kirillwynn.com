# staging.secretroom.kirillwynn.com
# Step 1: HTTP server for ACME + redirect to HTTPS

server {
    listen 80;
    listen [::]:80;

    server_name staging.secretroom.kirillwynn.com;

    # Let's Encrypt http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else -> https
    location / {
        return 301 https://$host$request_uri;
    }
}

# Step 2: HTTPS server (staging placeholder)

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name staging.secretroom.kirillwynn.com;

    # Certs will appear here after certbot runs
    ssl_certificate     /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/privkey.pem;

    # Minimal sane TLS settings
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Placeholder page (for now)
    location / {
        add_header Content-Type text/plain;
        return 200 "staging.secretroom is alive (nginx)\n";
    }
}
