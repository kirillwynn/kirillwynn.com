# staging.secretroom.kirillwynn.com.conf
#
# Purpose:
# - Staging entrypoint for the admin / frontend SPA
# - Used for testing frontend + API integration before prod
# - Isolated from main site (kirillwynn.com)
#
# This file is included by the main nginx.conf via:
#   include /etc/nginx/conf.d/*.conf;
#
# IMPORTANT:
# - ONLY server {} blocks are allowed here
# - NO http {} or events {} blocks

# ------------------------------------------------------------
# HTTP (:80) — ACME challenge + redirect to HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name staging.secretroom.kirillwynn.com;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    # Redirect everything else to HTTPS
    return 301 https://staging.secretroom.kirillwynn.com$request_uri;
}

# ------------------------------------------------------------
# HTTPS (:443) — staging site
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name staging.secretroom.kirillwynn.com;

    # Certificates (created by certbot)
    ssl_certificate     /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/privkey.pem;

    # Modern TLS
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_ciphers
        ECDHE-ECDSA-AES256-GCM-SHA384:
        ECDHE-RSA-AES256-GCM-SHA384:
        ECDHE-ECDSA-CHACHA20-POLY1305:
        ECDHE-RSA-CHACHA20-POLY1305:
        ECDHE-ECDSA-AES128-GCM-SHA256:
        ECDHE-RSA-AES128-GCM-SHA256;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------
    # Security headers (staging-safe)
    # --------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # NOTE:
    # CSP is intentionally relaxed for development/staging.
    # We will lock this down once frontend build is final.
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'unsafe-inline' http://localhost:5173 https://esm.sh;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        connect-src 'self' https://kirillwynn.com https://staging.secretroom.kirillwynn.com;
        font-src 'self' data:;
    " always;

    # --------------------------------------------------------
    # ACME challenge on HTTPS (required by some validators)
    # --------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    # --------------------------------------------------------
    # TEMPORARY placeholder (until frontend build is wired)
    # --------------------------------------------------------
    location / {
        add_header Content-Type text/plain;
        return 200 "staging.secretroom.kirillwynn.com — nginx is alive\n";
    }
}
