# staging.secretroom.http.conf
#
# Always-on HTTP vhost for:
# - ACME HTTP-01 challenge (Let's Encrypt)
# - Safe bootstrap (nginx must start even if TLS cert doesn't exist yet)

server {
    listen 80;
    listen [::]:80;

    server_name staging.secretroom.kirillwynn.com;

    # ACME challenge (webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    # Bootstrap response (no HTTPS redirect until cert exists)
    location / {
        add_header Content-Type text/plain;
        return 200 "staging.secretroom.kirillwynn.com (http) — acme bootstrap\n";
    }
}
