# kirillwynn.com.conf
#
# Responsibilities:
# - Terminate TLS (HTTPS)
# - Redirect all traffic to canonical https://kirillwynn.com
# - Serve ACME HTTP-01 challenges (Let's Encrypt)
# - Proxy application traffic to Flask/Gunicorn (app:5000)
# - Add basic security headers
#
# IMPORTANT:
# This file is included by the base nginx.conf inside the Docker image.
# Therefore:
# - NO `events {}` block
# - NO `http {}` block
# - ONLY `server {}` blocks are allowed here

# ------------------------------------------------------------
# HTTP (:80) — ACME challenge + redirect to HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name kirillwynn.com www.kirillwynn.com;

    # Serve Let's Encrypt HTTP-01 challenge files
    # This MUST exist on port 80 or cert renewal will fail
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    # Redirect everything else to canonical HTTPS
    return 301 https://kirillwynn.com$request_uri;
}

# ------------------------------------------------------------
# HTTPS (:443) — redirect www → canonical
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.kirillwynn.com;

    ssl_certificate     /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_ciphers
        ECDHE-ECDSA-AES256-GCM-SHA384:
        ECDHE-RSA-AES256-GCM-SHA384:
        ECDHE-ECDSA-CHACHA20-POLY1305:
        ECDHE-RSA-CHACHA20-POLY1305:
        ECDHE-ECDSA-AES128-GCM-SHA256:
        ECDHE-RSA-AES128-GCM-SHA256;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    return 301 https://kirillwynn.com$request_uri;
}

# ------------------------------------------------------------
# HTTPS (:443) — main canonical site
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name kirillwynn.com;

    ssl_certificate     /etc/letsencrypt/live/kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirillwynn.com/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_ciphers
        ECDHE-ECDSA-AES256-GCM-SHA384:
        ECDHE-RSA-AES256-GCM-SHA384:
        ECDHE-ECDSA-CHACHA20-POLY1305:
        ECDHE-RSA-CHACHA20-POLY1305:
        ECDHE-ECDSA-AES128-GCM-SHA256:
        ECDHE-RSA-AES128-GCM-SHA256;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------
    # Security headers
    # --------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # NOTE:
    # This CSP is intentionally permissive for now.
    # We will tighten it once the React SPA is fully served from nginx.
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' https://cdn.tailwindcss.com https://esm.sh;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src https://fonts.gstatic.com;
    " always;

    # --------------------------------------------------------
    # ACME challenge on HTTPS (some clients hit HTTPS directly)
    # --------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    # --------------------------------------------------------
    # Compression
    # --------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript;

    # --------------------------------------------------------
    # Static assets (proxied to Flask)
    # --------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;

        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------
    # Webhook endpoint
    # --------------------------------------------------------
    location /webhook {
        proxy_pass http://app:5000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------------
    # Main application
    # --------------------------------------------------------
    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
