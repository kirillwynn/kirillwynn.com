# nginx/conf.d/staging.secretroom.conf
#
# Single source of truth for staging.secretroom.kirillwynn.com
# - HTTP :80  -> ACME + redirect to HTTPS
# - HTTPS:443 -> serves SPA + proxies /api/* to Flask (no rewrites)
#
# Image contains:
# - /etc/nginx/conf.d/* (this file)
# - /usr/share/nginx/html/* (Vite dist baked into image)
#
# Runtime mounts in nginx container:
# - /etc/letsencrypt (read-only)
# - /var/www/certbot

# -------------------------
# HTTP (ACME + redirect)
# -------------------------
server {
    listen 80;
    listen [::]:80;

    server_name staging.secretroom.kirillwynn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------
# HTTPS (SPA + API)
# -------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name staging.secretroom.kirillwynn.com;

    ssl_certificate     /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.secretroom.kirillwynn.com/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Some validators hit HTTPS directly
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
        allow all;
    }

    # API -> Flask (Flask owns /api/*)
    location ^~ /api/ {
        proxy_pass http://app:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # SPA (Vite dist baked into nginx image)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}